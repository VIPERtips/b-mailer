<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{EMAIL_TITLE}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
        }

        .email-wrapper {
            width: 100%;
            padding: 30px 0;
            background-color: #f4f6f8;
        }

        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }

        .email-header {
            background-color: #1e40af;
            padding: 20px;
            text-align: center;
            color: #ffffff;
        }

        .email-header img {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
        }

        .email-header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .email-title {
            color: #ffffff;
        }

        .email-body {
            padding: 30px;
        }

        .greeting {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .message {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #374151;
        }

        .contact-block {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .contact-block p {
            margin: 6px 0;
            font-weight: 500;
        }

        .email-footer {
            background-color: #f9fafb;
            padding: 16px 24px;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            border-top: 1px solid #e5e7eb;
        }

        .email-footer strong {
            color: #374151;
        }

        @media (max-width: 600px) {
            .email-body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
<div class="email-wrapper">
    <div class="email-container">

        <div class="email-header">
            <img src="{{ICON_URL}}" alt="Blexta Logo">
            <h1 class="email-title">{{EMAIL_TITLE}}</h1>
        </div>

        <div class="email-body">
            <div class="greeting">
                {{GREETING}}
            </div>

            <div class="message">
                {{MESSAGE_CONTENT}}
            </div>

            {{CONTACT_BLOCK}}
        </div>

        <div class="email-footer">
            <strong>Blexta</strong><br>
            {{FOOTER_MESSAGE}}
        </div>

    </div>
</div>
</body>
</html>
