<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>{{EMAIL_TITLE}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f4f7;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f7;padding:24px;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:6px;overflow:hidden;">

                <!-- Header -->
                <tr>
                    <td style="background-color:#d9ecff;padding:20px;text-align:center;">
                        <img src="{{ICON_URL}}" alt="Blexta"
                             style="width:40px;height:40px;margin-bottom:8px;" />
                        <div style="font-size:18px;font-weight:bold;color:#2f3a45;">
                            Blexta Assistant
                        </div>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="padding:24px;color:#2f3a45;">

                        <h2 style="margin-top:0;font-size:18px;">
                            {{EMAIL_TITLE}}
                        </h2>

                        <p style="font-size:14px;margin:12px 0;">
                            {{GREETING}}
                        </p>

                        <p style="font-size:14px;margin:12px 0;">
                            {{MESSAGE_CONTENT}}
                        </p>

                        <!-- Lead Block -->
                        <div style="
                margin-top:16px;
                padding:16px;
                background-color:#f7f9fc;
                border:1px solid #d1d9e0;
                border-radius:4px;
                font-size:13px;
                color:#2f3a45;
              ">
                            {{LEAD_BLOCK}}
                        </div>

                        <!-- CTA -->
                        <div style="margin-top:24px;text-align:center;">
                            <a href="{{CTA_URL}}"
                               style="
                     display:inline-block;
                     padding:12px 20px;
                     background-color:#d9ecff;
                     color:#2f3a45;
                     text-decoration:none;
                     font-weight:bold;
                     border-radius:4px;
                   ">
                                {{CTA_TEXT}}
                            </a>
                        </div>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="
              background-color:#f2f4f7;
              padding:16px;
              text-align:center;
              font-size:12px;
              color:#6b7280;
            ">
                        {{FOOTER_MESSAGE}}
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
