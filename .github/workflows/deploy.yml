name: Deploy B-Mailer

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "target/*.jar"
          target: "/root/b-mailer"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /root/b-mailer

            echo "Stopping old process..."
            pkill -f "b-mailer.jar" || true

            echo "Finding jar..."
            JAR_FILE=$(ls *.jar 2>/dev/null | head -n 1)

            if [ -z "$JAR_FILE" ]; then
              echo "No JAR found"
              exit 1
            fi

            echo "Deploying jar..."
            mv -f "$JAR_FILE" b-mailer.jar

            echo "Starting app..."

            nohup java -jar b-mailer.jar > b-mailer.log 2>&1 & disown

            echo "B-Mailer deployed successfully"